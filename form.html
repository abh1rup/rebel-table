  <meta charset="utf-8" />

  <title>Contact | Rebel Table</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/main.js" defer></script>
</head>
<body>

<header class="hero">
  <h1>Contact Us</h1>
  <p>Explore our Southern-inspired restaurant and try our interactive contact form.</p>
  <a class="btn" href="menu.html">View Menu</a>
</header>

<main>
  <h2 class="center">Get in touch</h2>

  <form id="contactForm">
    <label for="firstName">First Name*</label>
    <input id="firstName" type="text" name="firstName" required>

    <label for="lastName">Last Name*</label>
    <input id="lastName" type="text" name="lastName" required>

    <label for="email">Email*</label>
    <input id="email" type="email" name="email" required>

    <label for="phone">Phone</label>
    <input id="phone" type="tel" name="phone" placeholder="662-555-0194">

    <label for="message">Message (max 500 characters)</label>
    <textarea id="message"
              name="message"
              maxlength="500"
              rows="5"
              placeholder="Write your message here…"></textarea>

    <button type="submit" class="btn">Submit</button>
  
  </form>

  <hr>

  <section class="menu-photo">
    <figure>
     <img src="images/Food5.jpg" alt="Assorted crispy vegetable dishes garnished with herbs and served with lemon wedges on a rectangular platter.">
      <figcaption>
  Photo by
  <a href="https://unsplash.com/@kimbroughdaniels"

  </a>
  on
  <a href="https://unsplash.com"
     target="_blank" rel="noopener noreferrer">
    Unsplash
  </a>
</figcaption>
    </figure>
  </section>
</main>
